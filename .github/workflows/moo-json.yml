# Generated from https://github.com/Blue-Mink/moo/blob/main/templates/moo-autoupdate.yml
# Auto-update moo.json after a stable release. Edit the env block if needed.
name: Update moo.json
on:
  release:
    types: [published]
  push:
    paths:
      - ".github/workflows/moo-json.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (empty = the one that triggered this run)"
        required: false
permissions:
  contents: write
concurrency:
  group: moo-json-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    env:
      FPK_ARTIFACT: "fpk.zip"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ github.inputs.tag }}" ]]; then
            echo "tag=${{ github.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
      - name: Release notes
        run: echo "TAG=${{ steps.tag.outputs.tag }}"
      - name: Download FPK
        # 这里保留你原来下载逻辑
        run: echo "Download fpk"
      - name: Verify digest
        run: echo "verify"
      - name: Fetch updater
        run: echo "fetch updater"
      - name: Debug check files
        run: |
          ls -la
          cat moo.json || echo "moo.json not exist"
      - name: Update moo.json
        run: |
          # 重点修复：不存在就写入 {}，不是touch空文件
          if [ ! -f moo.json ]; then
            echo '{}' > moo.json
          fi
          # 下面放你原来更新json、jq修改字段的逻辑
          # 示例 jq 写法参考：
          # jq --arg t "${{ steps.tag.outputs.tag }}" '.version = $t' moo.json > tmp.json && mv tmp.json moo.json
      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add moo.json
          git commit -m "Auto update moo.json for ${{ steps.tag.outputs.tag }}" || echo "No changes to commit"
          git push
