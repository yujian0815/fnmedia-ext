# Generated from https://github.com/Blue-Mink/moo/blob/main/templates/moo-autoupdate.yml
# Auto-update moo.json after a stable release. Edit the env block if needed.
name: Update moo.json
on:
  release:
    types: [published]
  push:
    paths:
      - ".github/workflows/moo-json.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (empty = the one that triggered this run)"
        required: false
permissions:
  contents: write
concurrency:
  group: moo-json-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    env:
      FPK_GLOB: "fnmedia-ext-*[0-9].fpk"
      KEEP: "2"
      MOO_JSON: "moo.json"
      BRANCH: "main"
      SCRIPT_REF: "main"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - name: Resolve tag
        id: t
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then TAG=$(gh release view --json tagName --jq .tagName); fi
          [ -n "$TAG" ] || { echo "::error::no tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.t.outputs.tag }}" --json body --jq .body > /tmp/notes.md || : > /tmp/notes.md
      - name: Download FPK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/fpk
          gh release download "${{ steps.t.outputs.tag }}" --pattern "$FPK_GLOB" --dir /tmp/fpk
          [ -n "$(ls -A /tmp/fpk)" ] || { echo "::error::no FPK matched $FPK_GLOB"; exit 1; }
      - name: Verify digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/${{ steps.t.outputs.tag }}" --jq '.assets[] | "\(.name) \(.digest)"' > /tmp/d.txt || exit 0
          fail=0
          for f in /tmp/fpk/*.fpk; do
            n=$(basename "$f")
            w=$(awk -v n="$n" '$1==n{print $2}' /tmp/d.txt | sed 's/^sha256://')
            [ -z "$w" ] && continue
            g=$(sha256sum "$f" | awk '{print $1}')
            [ "$w" = "$g" ] || { echo "::error::$n digest mismatch"; fail=1; }
          done
          exit $fail
      - name: Fetch updater
        run: |
          if [ -f tools/update_moo_json.py ]; then
            cp tools/update_moo_json.py /tmp/u.py
          else
            curl -fsSL --max-time 60 "https://raw.githubusercontent.com/Blue-Mink/moo/${SCRIPT_REF}/tools/update_moo_json.py" -o /tmp/u.py || curl -fsSL --max-time 60 "https://cdn.jsdelivr.net/gh/Blue-Mink/moo@${SCRIPT_REF}/tools/update_moo_json.py" -o /tmp/u.py
          fi
          python3 /tmp/u.py --help >/dev/null
      - name: Debug check files
        run: |
          echo "===== PWD ====="
          pwd
          echo "===== MOO_JSON ====="
          echo "$MOO_JSON"
          echo "===== git tracked files ====="
          git ls-files | grep -i moo
          echo "===== all files ====="
          ls -la
      - name: Update moo.json
        run: |
          # 文件不存在则先创建空文件，脚本就不会报找不到
          if [ ! -f "$MOO_JSON" ]; then
            touch "$MOO_JSON"
          fi
          ARGS=""
          if [ -s /tmp/notes.md ]; then ARGS="--changelog-file /tmp/notes.md"; fi
          python3 /tmp/u.py --file "$MOO_JSON" --tag "${{ steps.t.outputs.tag }}" --fpk /tmp/fpk/*.fpk --keep "${KEEP:-2}" $ARGS
      - name: Commit
        run: |
          git diff --quiet -- "$MOO_JSON" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MOO_JSON"
          git commit -m "chore(moo.json): sync ${{ steps.t.outputs.tag }}"
          git push origin "HEAD:${BRANCH}"
