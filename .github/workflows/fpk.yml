name: Build FPK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - VERSION
      - proxy/**
      - deploy/**
      - packaging/**
      - requirements.txt
      - tests/**
      - .github/workflows/fpk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
        env:
          PYTHONUTF8: "1"
      - run: sudo apt-get update && sudo apt-get install -y rsync
      - run: bash packaging/fpk/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fnmedia-ext-fpk
          path: |
            dist/*.fpk
            dist/*.fpk.sha256
          if-no-files-found: error
